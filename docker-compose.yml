version: "3.9"

services:
  core:
    build: ./core
    container_name: expert-core
    environment:
      # Туннель открывается внутри контейнера, модель доступна локально.
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_MODEL=deepseek-r1:70b
      - HPC_TUNNEL_ENABLED=1
      - HPC_TUNNEL_REQUIRED=1
      - HPC_TUNNEL_PER_REQUEST=0
      - HPC_SSH_USER=averichie
      - HPC_LOGIN_HOST=login1.hpc.spbstu.ru
      - HPC_SSH_STRICT_HOST_CHECKING=accept-new
      - HPC_SSH_IDENTITY_FILE=/root/.ssh/supercomputer
      - HPC_SLURM_CLUSTER=nv
      - HPC_SLURM_CONSTRAINT=ollama
      - HPC_GPU_COUNT=7
      - HPC_MEM_PER_GPU=32G
      - HPC_SLURM_TIME=1:00:00
      - HPC_REQUESTED_JOB_HOURS=1.0
      - HPC_MAX_WEEKLY_HOURS=10
      - HPC_JOB_NAME=ollama
      - HPC_REMOTE_SLURM_PATH=~/ollama.slurm
      - HPC_LOCAL_PORT=11434
      - HPC_REMOTE_PORT=11434
      - HPC_RUNTIME_DIR=/app/runtime
      - HPC_SSH_SOCKET_PATH=/tmp/hpc_tunnel.sock
      - HPC_OLLAMA_READY_TIMEOUT_SEC=0
      - HPC_OLLAMA_READY_INTERVAL_SEC=5
      - HPC_START_TIMEOUT_SEC=1800
      - RAG_DOCS_DIR=/app/docs
    volumes:
      - ./core/runtime:/app/runtime
      - ./docs:/app/docs:ro
      - /Users/averichie/Desktop/ACHTUNG:/root/.ssh:ro
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: expert-backend
    environment:
      - CORE_SERVICE_URL=http://core:8000
      - BACKEND_ANALYZE_TIMEOUT_SEC=0
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - core
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: expert-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
